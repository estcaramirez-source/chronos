# Pipeline de Integración Continua - CHRONOS XXI
# Orden "fail fast": de la verificación más barata a la más costosa.
name: CI

on:
  push:
    # feature/** incluido para dejar evidencia de cada paso TDD (rojo → verde → refactor)
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Mínimo privilegio por defecto; cada job amplía solo lo que necesita.
permissions:
  contents: read

# Si llega un commit nuevo a la misma rama/PR, se cancela la ejecución anterior (ahorra minutos).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Lint, pruebas y cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write   # solo para comentar el reporte en el PR
    steps:
      - name: Checkout del código (historial completo para el escaneo de secretos)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Escaneo de secretos en todo el historial (gitleaks)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          mkdir -p reports
          ./gitleaks detect --source . --redact --verbose --report-format json --report-path reports/gitleaks.json
          echo "::notice title=Secretos::gitleaks revisó $(git rev-list --count HEAD) commits; hallazgos: $(grep -c '"RuleID"' reports/gitleaks.json || true)"

      - name: Configurar Node.js con caché de dependencias
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package.json

      - name: Instalación de dependencias
        run: npm install --no-audit --no-fund

      - name: Análisis estático (ESLint, 0 errores y 0 advertencias, complejidad ≤ 10)
        run: npm run lint

      - name: Reporte de complejidad ciclomática
        run: npm run complexity

      - name: Auditoría de dependencias (sin vulnerabilidades críticas)
        run: npm audit --audit-level=critical

      - name: Pruebas unitarias y umbral de cobertura
        run: npm run test:ci

      - name: Resumen de pruebas y cobertura
        if: always()
        run: node scripts/coverage-summary.js

      - name: Publicar reportes como artefacto
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reportes-ci-${{ github.run_number }}
          path: |
            coverage/
            reports/
          retention-days: 14
          if-no-files-found: warn

      - name: Comentar el reporte en el pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const file = 'coverage/coverage-comment.md';
            if (!fs.existsSync(file)) return;
            const body = fs.readFileSync(file, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find(c => c.body.includes('<!-- chronos-ci-report -->'));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  staging-smoke:
    name: Staging (Docker) y pruebas de humo
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: staging
      STAGING_PORT: '8080'
    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Construir imagen de staging
        run: |
          docker build \
            --build-arg APP_VERSION=${{ github.sha }} \
            --build-arg APP_ENV=${APP_ENV} \
            -t chronos-xxi:${{ github.sha }} .

      - name: Desplegar contenedor de staging
        run: docker run -d --name chronos-staging -p ${STAGING_PORT}:80 chronos-xxi:${{ github.sha }}

      - name: Pruebas de humo posteriores al despliegue
        run: bash scripts/smoke-test.sh "http://localhost:${STAGING_PORT}"

      - name: Logs del contenedor (solo si falla)
        if: failure()
        run: docker logs chronos-staging
